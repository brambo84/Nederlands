<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proefexamen Nederlands</title>
<style>
:root{--bg:#f5f4f8;--card:#fff;--ink:#1f2328;--muted:#5d646e;--line:#dde2ea;--acc:#6d3fa8;--acc-ink:#fff;--soft:#efe8f8;
--ok:#1d7a46;--okbg:#e7f4ec;--bad:#b42318;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#212328;--ink:#ecebe7;--muted:#a3a7ae;--line:#35383e;--acc:#bb98ef;--acc-ink:#111;--soft:#2d2340;
--ok:#4cc38a;--okbg:#16342a;--bad:#f2786c;--badbg:#3b1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
header h1{font-size:1.15rem;margin:0}
header span{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{margin:0 0 8px;font-size:1.4rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
ul.topics{margin:.3em 0 1em;padding-left:1.2em}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--acc);background:var(--soft);padding:2px 9px;border-radius:99px;margin:0 6px 8px 0}
.tag.plus{color:var(--bad);background:var(--badbg)}
.qtext{font-size:1.05rem}
.zin{font-size:1.15rem;margin:12px 0;padding:10px 14px;background:var(--bg);border-left:4px solid var(--acc);border-radius:0 10px 10px 0}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.choice.sel{border-color:var(--acc);background:var(--soft)}
.choice.sel .k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.inrow{margin-top:12px;max-width:340px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.words button{padding:7px 10px;font-size:1.08rem}
.words button.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tekst{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:14px}
.tekst summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--acc)}
.tekst h3{margin:4px 0 6px;font-size:1.12rem}
.tekst h4{margin:10px 0 2px;font-size:.95rem;color:var(--acc)}
.tekst p{margin:.2em 0 .6em;font-size:.97rem}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dots button{width:34px;height:34px;padding:0;font-size:.8rem;border-radius:8px}
.dots button.ans{background:var(--soft);border-color:var(--acc)}
.dots button.cur{outline:2px solid var(--acc);outline-offset:1px}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:14px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap}
.rev{border-left:4px solid var(--line);margin-top:14px}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.verd{font-weight:700}
.ok .verd{color:var(--ok)}
.bad .verd{color:var(--bad)}
.ans{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.ans.mine{background:var(--bg)}
.rev.ok .ans.mine{background:var(--okbg)}
.rev.bad .ans.mine{background:var(--badbg)}
.ans.right{background:var(--okbg)}
.uitleg{margin-top:10px;font-size:.93rem;color:var(--muted)}
.hist{font-size:.9rem;margin-top:10px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gg>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.gg b.h{font-size:.85rem;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}
.gg ul{margin:4px 0 0;padding-left:1.1em}
.gg li{margin:2px 0}
@media (max-width:480px){.gg{grid-template-columns:1fr}}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.small{font-size:.85rem}
</style>
</head>

let SEEN = null;                                   // enkel gevuld tijdens buildExam()
function fresh(id, list){
  const seen = (SEEN && SEEN[id]) || [];
  let free = list.map((_,i)=>i).filter(i=>!seen.includes(i));
  let base = seen;
  if(!free.length){ base = []; free = list.map((_,i)=>i).filter(i=>i!==seen[seen.length-1] || list.length===1); }
  const i = pick(free);
  if(SEEN) SEEN[id] = [...base, i];
  return list[i];
}

  const ch = shuffle([correct,...wrong]);

  return {type:'mc', text, choices:ch, correct:ch.indexOf(correct), uitleg, ...ex};
}
function mcf(text, choices, correct, uitleg, ex){  // vaste volgorde
  if(!choices.includes(correct)) throw new Error('antwoord ontbreekt');
  return {type:'mc', text, choices:[...choices], correct:choices.indexOf(correct), uitleg, ...ex};
}

    const end=w.includes(']'); w=w.replace(']','');
    if(on) corr.push(toks.length);
    if(end) on=false;
    toks.push(w);
  }
  if(!corr.length) throw new Error('niets gemarkeerd');
  return {type:'sel', text, toks, correct:corr, uitleg, ...ex};
}

 ()=>{ const [s,c]=fresh('sign',SIGN); return mcf(`Wat mag je verwachten na het <b>signaalwoord</b> '${s}'?`, ['een synoniem','een antoniem','voorbeelden'], c, 'Synoniem: met andere woorden, oftewel. Antoniem: maar, daarentegen, in tegenstelling tot, echter. Voorbeelden: zoals, bijvoorbeeld, denk maar aan, neem nu.'); },
 ()=>{ if(Math.random()<.5){ const [w,a]=fresh('meerv',MEERV); return inv('Schrijf het <b>meervoud</b>.', a, `Eén ${w}, twee <b>${a}</b>.`, {gg:gg([`enkelvoud: <b>${w}</b>`],'het meervoud'), hint:'Let op apostrof en accent.'}); }
   const [w,a]=fresh('verkl',VERKL); return inv('Schrijf het <b>verkleinwoord</b>.', a, `Het verkleinwoord van ${w} is <b>${a[0]}</b>.`, {gg:gg([`zelfstandig naamwoord: <b>${w}</b>`],'het verkleinwoord'), hint:'Typ één woord.', art:true}); },
],
S:[
 ()=>{ const [w,t,s]=fresh('stw',STW); return mc(`Wat betekent het schooltaalwoord <b>${w}</b>?`, s, others(s,STW.filter(x=>x[1]===t).map(x=>x[2])), `<b>${w}</b> = ${s}.`); },
 ()=>{ const [w,t,s]=fresh('stw2',STW); return mc(`Welk schooltaalwoord past bij deze betekenis?${zin(s)}`, w, others(w,STW.filter(x=>x[1]===t).map(x=>x[0])), `<b>${w}</b> = ${s}.`); },
 ()=>{ const [w,a]=fresh('stant',STANT); return mc(`Welk woord is een <b>antoniem</b> van <b>${w}</b>?`, a, others(a,STANT.filter(x=>x[0]!==w).map(x=>x[1]).filter(x=>!((w==='uitgebreid'||w==='interessant')&&x==='alledaags')&&!(w==='uniek'&&x==='saai'))), `${w} ↔ <b>${a}</b>`); },
 ()=>{ const [d,a]=fresh('stdef',STDEF); return inv('Welk <b>schooltaalwoord</b> zoeken we?', a, `Het schooltaalwoord is <b>${a[0]}</b>.`, {gg:gg([d,`begint met <b>${a[0][0]}</b>, ${a[0].length} letters`],'het schooltaalwoord'), hint:'Typ het woord zonder lidwoord.', art:true}); },
 ()=>{ const [z,c,w]=fresh('stzin',STZIN); return mc('Welk schooltaalwoord past het best in de zin?'+zin(gap(z)), c, w, z.replace('___',`<b>${c}</b>`)); },
 ()=>{ const [w,z,a]=fresh('stfam',STFAM); return inv(`Vul een woord in uit de <b>woordfamilie</b> van <b>${w}</b>.`, a, z.replace('___',`<b>${a[0]}</b>`).replace(/ \([^)]*\)$/,''), {gg:gg([gap(z)],`een woord uit de familie van <b>${w}</b>`), hint:'Typ alleen het ontbrekende woord.', plus:true}); },
 ()=>{ const r=fresh('stodd',STODD); return mc('Welk woord hoort <b>niet</b> in het rijtje thuis?', r[3], r.slice(0,3), `De andere drie woorden betekenen ongeveer hetzelfde; <b>${r[3]}</b> niet.`, PLUS); },
],
L:[
 ()=>{ const [s,c]=fresh('ttype',TTYPE); return mc('Welk <b>teksttype</b> is dit?'+zin(s), c, others(c,TTYPE.map(x=>x[1])), `De opmaak en de kenmerken verklappen het teksttype: ${c}.`); },
 ()=> Math.random()<.5 ? mc('Wat is <b>fictie</b>?', fresh('fic',FIC), shuffle(NFIC).slice(0,3), 'Bij fictie zijn de belangrijkste elementen verzonnen. Non-fictie geeft feiten en wil informeren.')
   : mc('Wat is <b>non-fictie</b>?', fresh('nfic',NFIC), shuffle(FIC).slice(0,3), 'Non-fictie geeft feiten en wil informeren. Bij fictie zijn de belangrijkste elementen verzonnen.'),
 ()=>mc('Je leest een tekst <b>oriënterend</b>. Wat doe je dan <b>niet</b>?', fresh('orin',['elke zin van de tekst aandachtig lezen','alle moeilijke woorden opzoeken','een samenvatting van elke alinea maken']), shuffle(['naar de titel kijken','de tussentitels bekijken','de illustraties bekijken','naar de bron en de schrijver kijken','opvallende woorden bekijken']).slice(0,3), 'Oriënterend lezen geeft je een eerste indruk: je bekijkt titel, tussentitels, illustraties, opvallende woorden, schrijver en bron.'),
 ()=>mc('Je wilt snel de <b>hoofdpunten</b> van een tekst kennen en leest daarom <b>globaal</b>. Wat lees je?', 'de inleiding, het slot, de tussentitels en de eerste en laatste zin van elke alinea', ['alleen de titel','elk woord, van begin tot einde','alleen de zinnen met een getal'], 'Globaal lezen = inleiding, slot, tussentitels en de eerste en laatste zin van elke alinea. Zo vind je het onderwerp en de hoofdpunten.'),
 ()=>{ const [s,c]=fresh('ims',IMS); return mcf('Welk <b>deel van een tekst</b> is dit?'+zin(s), ['de inleiding','het midden','het slot'], c, 'Inleiding: trekt de aandacht. Midden: de meeste informatie, in alinea\'s. Slot: conclusie of hoofdgedachte, geen nieuwe informatie.'); },
 ()=>{ const [k,r,p]=fresh('kern',KERN), al=p===0?[k,...r]:[...r,k];
   return mc('Wat is de <b>kernzin</b> van deze alinea?'+zin(al.join(' ')), k, r, 'De kernzin geeft het belangrijkste punt van de alinea. Vaak is dat de eerste of de laatste zin; de andere zinnen geven extra uitleg of voorbeelden.'); },
 ()=>{ const [s,c,ex]=fresh('topic',TOPIC); return mc('Met welk <b>vraagwoord</b> vraag je naar het vetgedrukte deel?'+zin(s), c, others(c,['Wie','Wat','Waar','Wanneer','Waarom','Hoe','Hoeveel','Waarmee'].filter(x=>!ex.includes(x))), `Topische vragen zijn vragen als Wie? Wat? Waar? Wanneer? Waarom? Hoe? Hier past: <b>${c}</b>?`); },
 ()=>{ const [t,c,w]=fresh('dpub',DPUB); return mc('Voor welk <b>doelpubliek</b> is deze tekst bedoeld?'+zin(t), c, w, `De titel verklapt het doelpubliek: ${c}.`); },
 ()=>{ const [t,tt,c,w]=fresh('titel',TITEL); return mc('Je leest deze tekst oriënterend. Wat is waarschijnlijk het <b>onderwerp</b>?', c, w, `De titel en de tussentitels samen verklappen het onderwerp: ${c}.`, {gg:gg([`titel: <b>${t}</b>`,...tt.map(x=>'tussentitel: '+x)],'het onderwerp van de tekst')}); },
 ()=>tfPick('ltf',[
   ['Een heel drukke lay-out maakt een tekst altijd beter leesbaar.',false,'Te veel is te veel: een te drukke lay-out maakt een tekst net moeilijk leesbaar.'],
   ['De flaptekst van een boek geeft je een idee van het verhaal.',true,'De flaptekst, de cover en de eerste bladzijde helpen je om een boek te kiezen.'],
   ['Fictie wil vooral feiten geven.',false,'Fictie is verzonnen en wil amuseren, ontroeren of laten beleven. Non-fictie geeft feiten.'],
   ['Topische vragen helpen je om een tekst of een onderwerp te verkennen.',true,'Met vragen als Wie? Wat? Waar? Wanneer? Waarom? verken je het onderwerp.'],
   ['In het slot van een tekst geeft de schrijver de meeste nieuwe informatie.',false,'De meeste informatie staat in het midden. In het slot komt geen nieuwe informatie meer.'],
   ['Door oriënterend te lezen ontdek je vaak al het onderwerp van de tekst.',true,'De titel, tussentitels en illustraties verklappen vaak het onderwerp.'],
   ['Een alinea herken je aan een witregel of een inspringing.',true,'Zo zie je waar een nieuwe alinea begint. Soms staat er ook een tussentitel boven.'],
 ]),
],
};

/* ===== Examen opbouwen ===== */
function gen(fn){ let err; for(let k=0;k<40;k++){ try{ return fn(); }catch(e){ err=e; } } throw err; }
function tekstVragen(n){
  const T=fresh('tekst',TEKSTEN), idx=TEKSTEN.indexOf(T), qs=T.q.map((_,i)=>i), chosen=[];
  while(chosen.length<n){ const i=fresh('tekstq'+idx,qs); if(!chosen.includes(i)) chosen.push(i); }
  return chosen.map(i=>{ const q=gen(T.q[i]); q.tekst=tekstHtml(T); q.topic='T'; q.gid='T'+idx+'_'+i; return q; });
}
function buildExam(){
  SEEN = store.get('seen',{});
  const qs=[];
  for(const t of Object.keys(QUOTA)){
    if(t==='T'){ qs.push(...tekstVragen(QUOTA.T)); continue; }
    const order=BANK[t].map((_,i)=>i), used=(SEEN['g'+t]||[]);      // onderdelen die het langst geleden gevraagd werden eerst
    const cnt=i=>used.filter(x=>x===i).length;
    const sel=shuffle(order).sort((a,b)=>cnt(a)-cnt(b)).slice(0,QUOTA[t]);
    SEEN['g'+t]=[...used,...sel].slice(-200);
    const part=[]; sel.forEach(i=>{ let q; for(let k=0;k<20;k++){ q=gen(BANK[t][i]); const id=plain(q.text+(q.gg||'')+(q.toks||[]).join(' ')); if(!part.some(p=>p.id===id)) { part.push({id,q}); break; } if(k===19) part.push({id,q}); } q.topic=t; q.gid=t+i; });
    qs.push(...shuffle(part.map(p=>p.q)));
  }
  store.set('seen',SEEN); SEEN=null;
  return qs;
}
const norm = (s,q) => {
  let t=String(s==null?'':s).normalize('NFC').replace(/[‘’´`ʼ]/g,"'").replace(/[‐-―−]/g,'-').replace(/\s+/g,' ').trim().toLowerCase();
  t=t.replace(/[.!?,;:…]+$/,'').replace(/^-+|-+$/g,'').trim();
  if(q&&q.art) t=t.replace(/^(de|het|een) (?=.)/,'');
  return t;
};
const isAns = a => a!=null && a!=='' && !(Array.isArray(a)&&!a.length) && !(typeof a==='string'&&!a.trim());
function isCorrect(q,a){
  if(!isAns(a)) return false;
  if(q.type==='mc') return a===q.correct;
  if(q.type==='sel') return Array.isArray(a) && a.length===q.correct.length && [...a].sort((x,y)=>x-y).every((x,i)=>x===q.correct[i]);
  return q.answers.some(x=>norm(x,q)===norm(a,q));
}
const toksOf = (q,a) => [...a].sort((x,y)=>x-y).map((i,k,A)=>(k&&A[k-1]!==i-1?'… ':'')+strip(q.toks[i])).join(' ');
const fmtAnswer = (q,a) => !isAns(a) ? '—' : q.type==='mc' ? q.choices[a] : q.type==='sel' ? esc(toksOf(q,a)) : esc(a);
const fmtCorrect = q => q.type==='mc' ? q.choices[q.correct] : q.type==='sel' ? toksOf(q,q.correct) : q.answers.length>1&&!q.art ? q.answers.join(' of ') : q.answers[0];

let S = store.get('state', null);
const save = () => store.set('state', S);

/* ===== Uitslag doorsturen (ntfy) ===== */
let flushing=false;
async function flushResults(){
  if(flushing) return; flushing=true;
  try{
    const q=store.get('outbox',[]); if(!q.length) return;
    const rest=[];
    for(const msg of q){
      try{ const r=await fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify(msg)}); if(!r.ok) rest.push(msg); }
      catch(e){ rest.push(msg); }
    }
    store.set('outbox',rest);
    const el=document.getElementById('sendstate');
    if(el) el.textContent = rest.length ? 'Uitslag nog niet doorgestuurd (geen verbinding?) — wordt later opnieuw geprobeerd.' : 'Uitslag doorgestuurd.';
  } finally { flushing=false; }
}
/* ntfy aanvaardt 4096 bytes; afkappen per byte, niet per teken */
const cut = (s,max) => { const E=new TextEncoder(); while(E.encode(s).length>max) s=s.slice(0,-20)+'…'; return s; };
function queueResult(){
  const r=S.result, n=S.questions.length;
  const per=Object.keys(QUOTA).map(t=>`${TOPICS[t]}: ${r.per[t][0]}/${r.per[t][1]}`).join('\n');
  const vraag=q=>{ let s=plain(q.text.replace('<b>Waar of onwaar?</b> ','')); if(q.gg) s+=' '+plain(q.gg.replace(/<b class="h">[^<]*<\/b>/g,'').split('</ul>')[0]); if(q.toks) s+=' '+q.toks.join(' '); return s.slice(0,110); };
  const fout=S.questions.map((q,i)=>isCorrect(q,S.answers[i])?null:`V${i+1} «${vraag(q)}»: gaf ${isAns(S.answers[i])?(q.type==='inv'?S.answers[i]:plain(fmtAnswer(q,S.answers[i]))):'niets'} — juist: ${plain(fmtCorrect(q))}`).filter(Boolean);
  const msg={topic:NTFY_TOPIC, title:`Nederlands${S.name?' – '+S.name:''}: ${r.score}/${n} (${r.pct}%)`,
    message:cut(`${new Date(r.end).toLocaleString('nl-BE')} · duur ${r.min} min\n\n${per}\n\n${fout.length?'Fout:\n'+fout.join('\n'):'Alles juist!'}`,3800),
    tags:[r.pct>=50?'white_check_mark':'x'], priority:3};
  const q=store.get('outbox',[]); q.push(msg); store.set('outbox',q);
}

/* ===== Schermen ===== */
const app=document.getElementById('app');
let tekstOpen=true;
const tags = q => `<span class="tag">${TOPICS[q.topic]}</span>${q.plus?'<span class="tag plus">+ uitbreiding</span>':''}`;
const tekstBox = (q,open) => q.tekst ? `<details class="tekst"${open?' open':''}><summary>Leestekst</summary>${q.tekst}</details>` : '';
function render(){
  if(!S || !S.questions) return renderStart();
  if(S.finished) return S.reviewing ? renderReview() : renderResult();
  renderQuestion();
}
function renderStart(){
  const name=store.get('name',''), hist=store.get('hist',[]), tot=Object.values(QUOTA).reduce((s,x)=>s+x,0);
  app.innerHTML=`<div class="card">
    <h2>Proefexamen</h2>
    <p class="muted">Leerstof: deel 1 en deel 2 (les 1 tot en met 20).</p>
    <ul class="topics">${Object.keys(QUOTA).map(t=>`<li>${TOPICS[t]} — ${QUOTA[t]} vragen <span class="muted small">(${LESSEN[t]})</span></li>`).join('')}</ul>
    <p class="small muted">${tot} vragen, geen tijdslimiet. Elk proefexamen heeft andere vragen. Let op je spelling bij de invulvragen. Je mag terugbladeren tot je indient.</p>
    <label class="f" for="nm">Je naam</label>
    <input type="text" id="nm" value="${esc(name)}" autocomplete="given-name">
    <div class="row"><span></span><button class="pri" id="go">Start proefexamen</button></div>
    ${hist.length?`<div class="hist"><b>Vorige pogingen</b><table class="tbl">${hist.slice(-8).reverse().map(h=>`<tr><td>${new Date(h.d).toLocaleDateString('nl-BE')} ${new Date(h.d).toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})}</td><td>${h.s}/${h.n} (${h.p}%)</td></tr>`).join('')}</table></div>`:''}
  </div>`;
  document.getElementById('go').onclick=()=>{
    const nm=document.getElementById('nm').value.trim(); store.set('name',nm);
    S={name:nm, questions:buildExam(), answers:[], cur:0, start:Date.now(), finished:false}; save(); render(); window.scrollTo(0,0);
  };
}
function renderQuestion(){
  const n=S.questions.length, i=S.cur, q=S.questions[i], a=S.answers[i];
  const answered=S.answers.filter(isAns).length;
  let body='';
  if(q.type==='mc') body=`<div class="choices">${q.choices.map((c,k)=>`<button class="choice ${a===k?'sel':''}" data-k="${k}"><span class="k">${'ABCDEF'[k]}</span><span>${c}</span></button>`).join('')}</div>`;
  else if(q.type==='sel') body=`<div class="words">${q.toks.map((w,k)=>`<button data-w="${k}" class="${Array.isArray(a)&&a.includes(k)?'sel':''}">${esc(w)}</button>`).join('')}</div><div class="hint">Tik op een woord om het aan te duiden. Nog eens tikken = weghalen.</div>`;
  else body=`<div class="inrow"><input type="text" id="inp" placeholder="antwoord" value="${a!=null?esc(a):''}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" lang="nl"></div><div class="hint">${q.hint||'Typ je antwoord.'} Hoofdletters maken niet uit, de spelling wel.</div>`;
  app.innerHTML=`<div class="bar"><i style="width:${answered/n*100}%"></i></div>
   <div class="card">
    ${tags(q)}
    <div class="muted small">Vraag ${i+1} van ${n}</div>
    ${tekstBox(q,tekstOpen)}
    <div class="qtext">${q.text}</div>${q.gg||''}${body}
    <div class="row"><button id="prev" ${i===0?'disabled':''}>← Vorige</button>
      ${i<n-1?`<button class="pri" id="next">Volgende →</button>`:`<button class="pri" id="done">Indienen</button>`}</div>
    <div class="dots">${S.questions.map((_,k)=>`<button data-go="${k}" class="${isAns(S.answers[k])?'ans':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div>
   </div>`;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ S.answers[i]=+b.dataset.k; save(); renderQuestion(); });
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.w, A=Array.isArray(S.answers[i])?[...S.answers[i]]:[]; S.answers[i]=A.includes(k)?A.filter(x=>x!==k):[...A,k].sort((x,y)=>x-y); save(); renderQuestion(); });
  const det=app.querySelector('details.tekst'); if(det) det.ontoggle=()=>{ tekstOpen=det.open; };
  const inp=document.getElementById('inp');
  if(inp){ inp.oninput=()=>{ S.answers[i]=inp.value; save(); };
           inp.onkeydown=e=>{ if(e.key==='Enter') (document.getElementById('next')||document.getElementById('done')).click(); };
           if(matchMedia('(pointer:fine)').matches) inp.focus({preventScroll:true}); }
  const go=k=>{ S.cur=k; save(); renderQuestion(); window.scrollTo(0,0); };
  document.getElementById('prev').onclick=()=>go(i-1);
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>go(i+1);
  const dn=document.getElementById('done'); if(dn) dn.onclick=finish;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
function finish(){
  const n=S.questions.length, open=n-S.questions.filter((_,i)=>isAns(S.answers[i])).length;
  if(open>0 && !confirm(`Je hebt nog ${open} vra${open>1?'gen':'ag'} niet beantwoord. Toch indienen?`)) return;
  const per={}; Object.keys(QUOTA).forEach(t=>per[t]=[0,0]);
  let score=0; S.questions.forEach((q,i)=>{ const ok=isCorrect(q,S.answers[i]); per[q.topic][1]++; if(ok){score++; per[q.topic][0]++;} });
  const end=Date.now();
  S.result={score, pct:Math.round(score/n*100), per, end, min:Math.max(1,Math.round((end-S.start)/60000))};
  S.finished=true; S.reviewing=false; save();
  const h=store.get('hist',[]); h.push({d:end,s:score,n,p:S.result.pct}); store.set('hist',h);
  queueResult(); render(); window.scrollTo(0,0); flushResults();
}
function renderResult(){
  const r=S.result, n=S.questions.length, p=r.pct;
  const col=p>=50?'var(--ok)':'var(--bad)', bg=p>=50?'var(--okbg)':'var(--badbg)';
  const msg=p>=85?'Uitstekend!':p>=70?'Goed bezig!':p>=50?'Geslaagd, maar er is nog werk.':'Nog even oefenen — bekijk zeker je fouten.';
  app.innerHTML=`<div class="card">
    <div class="score"><div class="ring" style="background:${bg};color:${col}">${r.score}/${n}</div>
      <div><h2>${p}%</h2><p>${msg}</p><p class="small muted">Duur: ${r.min} min</p></div></div>
    <table class="tbl">${Object.keys(QUOTA).map(t=>`<tr><td>${TOPICS[t]}</td><td>${r.per[t][0]} / ${r.per[t][1]}</td></tr>`).join('')}</table>
    <div class="row"><button id="new">Nieuw proefexamen</button><button class="pri" id="rev">Bekijk mijn antwoorden</button></div>
    <p class="small muted" id="sendstate"></p>
  </div>`;
  document.getElementById('rev').onclick=()=>{ S.reviewing=true; save(); render(); window.scrollTo(0,0); };
  document.getElementById('new').onclick=()=>{ S=null; store.del('state'); render(); window.scrollTo(0,0); };
}
function renderReview(){
  const r=S.result, n=S.questions.length;
  app.innerHTML=`<div class="card"><div class="row" style="margin-top:0"><b>Jouw antwoorden · ${r.score}/${n}</b><button id="back">← Uitslag</button></div></div>`+
   S.questions.map((q,i)=>{ const ok=isCorrect(q,S.answers[i]);
     return `<div class="card rev ${ok?'ok':'bad'}">${tags(q)}
       <div class="verd">Vraag ${i+1} · ${ok?'✓ Juist':'✗ Fout'}</div>
       ${tekstBox(q,false)}
       <div class="qtext">${q.text}</div>${q.toks?zin(esc(q.toks.join(' '))):''}${q.gg||''}
       <div class="ans mine"><b>Jouw antwoord:</b> ${fmtAnswer(q,S.answers[i])}</div>
       ${ok?'':`<div class="ans right"><b>Juist antwoord:</b> ${fmtCorrect(q)}</div>`}
       <div class="uitleg">${q.uitleg}</div></div>`; }).join('')+
   `<div class="row"><button id="back2">← Uitslag</button><button class="pri" id="new">Nieuw proefexamen</button></div>`;
  const back=()=>{ S.reviewing=false; save(); render(); window.scrollTo(0,0); };
  document.getElementById('back').onclick=back; document.getElementById('back2').onclick=back;
  document.getElementById('new').onclick=()=>{ S=null; store.del('state'); render(); window.scrollTo(0,0); };
}
render();
flushResults();
</script>
